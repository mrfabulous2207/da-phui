<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đá Phủi App — quản lý đội bóng</title>
<link rel="icon" href="logo-64.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fmkit/fig-tokens.css">
<style>
  :root { color-scheme: dark; }
  input, select, textarea { color-scheme: dark; }
  body { margin:0; background:#090F1D; color:#FAFAFF; font-family:'Be Vietnam Pro', system-ui, sans-serif; }
  a { color:#D16BF4; text-decoration:none; }
  a:hover { color:#E3ADF9; text-decoration:underline; }
  input, select { font-family:inherit; }
  input:focus, select:focus { outline:none; border-color:rgba(177,129,255,0.5); }
  .fmscroll { scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.14) transparent; }
  .fmscroll::-webkit-scrollbar { width:6px; height:6px; }
  .fmscroll::-webkit-scrollbar-button { display:none; width:0; height:0; }
  .fmscroll::-webkit-scrollbar-corner { background:transparent; }
  .fmscroll::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:100px; }
  .fmscroll::-webkit-scrollbar-track { background:transparent; }
  /* The cau thu, ngon ngu the bong: hang the la mau nen, diem la thu doc truoc,
     sau mat o day. Chuyen dong chi o hover va chi tren may co con tro that --
     tren dien thoai khong co trang thai hover, va mot the "dang hover" ket o
     dien thoai la mot loi. */
  .pcard { position:relative; overflow:hidden; transition:transform var(--dur-fast, .14s) var(--ease-out, ease), box-shadow var(--dur-fast, .14s) var(--ease-out, ease); }
  .pcard::after { content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(115deg, rgba(255,255,255,0) 36%, rgba(255,255,255,0.055) 50%, rgba(255,255,255,0) 64%); }
  @media (hover:hover) and (pointer:fine) {
    .pcard:hover { transform:translateY(-3px); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.24), 0 18px 38px rgba(0,0,0,0.5); }
  }
  .pc-top { display:flex; align-items:flex-start; gap:12px; min-height:62px; }
  .pc-idcol { display:flex; flex-direction:column; align-items:center; gap:1px; flex-shrink:0; min-width:52px; }
  .pc-rate { font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:800; font-size:38px; line-height:0.94; letter-spacing:-0.04em; font-variant-numeric:tabular-nums; }
  .pc-pos { font-size:13px; font-weight:800; letter-spacing:0.06em; }
  .pc-num { font-size:13px; font-weight:600; color:rgba(250,250,255,0.5); font-variant-numeric:tabular-nums; }
  /* Chu cai dau thay cho anh: app khong ep ai co anh, va mot o anh trong thi
     xau hon la khong co o nao. Mo di de no la nen chu khong phai noi dung. */
  .pc-photo { margin-left:auto; width:56px; height:56px; flex-shrink:0; border-radius:12px; object-fit:cover; border:1px solid; }
  .pc-face { margin-left:auto; font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:800; font-size:56px; line-height:1; opacity:0.13; user-select:none; }
  .pc-grade { position:absolute; right:14px; top:14px; width:22px; height:22px; display:grid; place-items:center; border-radius:6px; border:1px solid; font-size:13px; font-weight:800; }
  .pc-name { display:flex; flex-direction:column; gap:2px; padding-top:9px; border-top:1px solid; }
  .pc-nm { font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:700; font-size:18px; letter-spacing:-0.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pc-line { font-size:13px; font-weight:600; color:rgba(250,250,255,0.62); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pc-alt { font-size:13px; color:rgba(250,250,255,0.5); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pc-faces { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px 10px; }
  .pc-fc { display:grid; grid-template-columns:1fr auto; gap:2px 6px; align-items:baseline; min-width:0; }
  .pc-fk { font-size:13px; font-weight:700; letter-spacing:0.05em; color:rgba(250,250,255,0.62); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pc-fv { font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:800; font-size:15px; line-height:1; font-variant-numeric:tabular-nums; }
  .pc-fbar { grid-column:1 / -1; height:3px; border-radius:100px; background:rgba(255,255,255,0.10); overflow:hidden; }
  .pc-fbin { display:block; height:100%; border-radius:100px; }
  .pc-note { font-size:13px; color:rgba(250,250,255,0.58); }
  .pc-stats { margin-top:auto; display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; padding-top:10px; border-top:1px solid; }
  .pc-sv { display:block; font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:700; font-size:15px; line-height:1.1; font-variant-numeric:tabular-nums; }
  .pc-sk { display:block; margin-top:2px; font-size:13px; font-weight:600; letter-spacing:0.04em; color:rgba(250,250,255,0.55); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pc-foot { display:flex; align-items:center; gap:8px; min-height:20px; }
  /* Luoi the. `minmax(min(264px,100%),1fr)` KHONG cuu duoc man hep: 100% o day
     la chieu rong CUA COT chu khong phai cua khung, nen tren 375px no van chia
     hai cot 161px va cat chu 80 cho. Duoi 560px ep mot cot -- mot cai the doc
     duoc quan trong hon hai cai the chat chua duoc gi. */
  .pc-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(264px, 1fr)); gap:12px; min-width:0; }
  @media (max-width:560px) { .pc-grid { grid-template-columns:minmax(0, 1fr); } }
  .pc-tier { font-size:13px; font-weight:700; letter-spacing:0.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pc-att { margin-left:auto; flex-shrink:0; padding:3px 10px; border-radius:100px; font-size:13px; font-weight:600; white-space:nowrap; }
  *, *::before, *::after { box-sizing:border-box; }
  @media (min-width:900px) {
    /* 5 o: san + 3 nhom chi so + ho so. auto-fit cho ra 4 cot nen o thu 5 roi
       xuong hang hai, bo lai ba o trong -- hai phan ba mot hang luoi de khong.
       Khai thang 5 cot, va thu nho san trong ho so vi no la thu keo hang cao len. */
    .pfgrid > div { padding:14px !important; }
    .pfhero { padding:12px 20px !important; }
    .pfgrid > div:first-child > div:nth-child(2) { max-width:170px !important; }
    .fmapp { height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
    .fmapp > div { display:flex; flex-direction:column; height:100%; min-height:0; flex:1 1 auto; }
    .fmmain { flex:1 1 auto; min-height:0; overflow-y:auto; padding-bottom:96px !important; }
    .fmlineup { flex:1 1 auto; min-height:0; height:100%; display:flex; flex-direction:column; overflow:hidden; }
    .fmmain { display:flex; flex-direction:column; padding-bottom:88px !important; }
    .fmovershell { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:12px; }
    .fmovershell > .fmscroll:first-child { flex:0 0 auto; }
    .fmover { flex:1 1 auto; min-height:0; display:grid !important; grid-template-columns:minmax(0,1fr) minmax(0,368px) !important; grid-template-rows:minmax(0,1fr) !important; gap:12px; }
    .fmover > * { min-height:0; grid-row:1 !important; overflow-y:auto; }
    .fmover > *:nth-child(1) { grid-column:1 !important; }
    .fmover > *:nth-child(2) { grid-column:2 !important; display:flex; flex-direction:column; gap:12px; }
    .fmover > * > * { flex:0 0 auto; }
    .fmover .fmscroll { max-height:none !important; overflow:visible !important; }
    .fmover > *:nth-child(1) { grid-column:1; grid-row:1 / span 2; }
    .fmover > *:nth-child(2) { grid-column:2; grid-row:1; }
    .fmover > *:nth-child(3) { grid-column:2; grid-row:2; }
    .fmstage { flex:1 1 auto; min-height:0; height:auto; }
    .fmstage > div { min-height:0; }
    .fmbar { flex-wrap:nowrap !important; overflow-x:auto; min-height:40px; padding:6px 12px !important; flex-shrink:0; align-items:center; }
    .fmlineup { gap:6px !important; }
    /* The pane takes its width from the pitch, so the toolbar above it ends at the
       touchline instead of running on across the rail. Only the pitch contributes
       a definite width; the strip is width:0 / min-width:100%, which is what stops
       its own content widening the column -- that is how this last painted 176px
       over the rail when the stat strip joined the toolbar row.
       Exact whenever the pitch is at its 430px cap, which is every viewport tall
       enough to draw it. Below ~700px of pane height the pitch shrinks and the
       strip stays at its own min-content, overhanging by a few dozen px. Fixable
       with contain:inline-size, but that wraps the strip to two rows and takes
       the height back out of the pitch, which is the worse trade. */
    .fmpitchpane { width:100%; max-width:100%; min-width:0; overflow:hidden; display:flex; flex-direction:column; gap:6px; align-items:center; justify-content:center; }
    .fmpitchpane > .fmscroll { width:100% !important; margin-inline:auto; }
    .fmpitchpane > .fmwarn { max-width:100%; margin-inline:auto; }
    .fmside { display:grid !important; grid-template-columns:repeat(auto-fit, minmax(232px,1fr)); align-content:start; gap:12px !important; }
    .fmside > *:first-child { grid-column:1 / -1; }
    .fmside > *:nth-child(n+4) { grid-column:1 / -1; }
    .fmside > * { min-width:0; }
    .fmstage { flex:1 1 auto; min-height:0; grid-auto-rows:minmax(0,1fr) !important; align-items:stretch; }
    .fmpitchpane > *:not(.fmpitch) { flex-shrink:0; }
    /* flex-grow:1 stretched the pitch past its own height, so the aspect ratio lost
       again whenever the pane was taller than the pitch: measured 0.682 on a 3/4
       pitch in a 670px pane. It sizes itself and the column centres it. */
    .fmpitch { flex:0 1 auto; min-height:0; height:100%; width:auto !important; max-width:100%; overflow:visible !important; box-shadow:0 24px 60px rgba(0,0,0,0.45), inset 0 0 0 1.5px rgba(193,212,57,0.22) !important; }
    .fmstage > .fmscroll > * { flex-shrink:0 !important; overflow:visible !important; }
    /* Two pitches share the row on wide screens, so the pitch is no longer a
       direct child of the pane -- the height chain has to pass through the row
       and the per-pitch column or `height:100%` resolves against nothing. */
    .fmpitchrow { flex:1 1 auto !important; min-height:0; align-items:stretch !important; }
    .fmpitchrow > div { min-height:0; height:100%; justify-content:flex-end; }
    .fminstr { container-type:inline-size; }
    /* The bottom bar is gone above 1080px; do not keep reserving its height. */
    .fmmain { padding-bottom:88px !important; }
  }
  @media (min-width:1080px) {
    .fmmain { padding-bottom:16px !important; }
  }

  .fmstage > * { min-height:0; }
  .fmstage > * { min-height:0; }
  /* One scale for the whole pitch drawing. Token size, the box that positions it,
     and every pitch marking are all percentages of the pitch's own width, so the
     drawing stays proportional at any size instead of three systems drifting apart.
     Was: positioning box clamp(30px,13cqw,46px), token clamp(32px,14cqw,52px),
     markings hard px. The token outgrew its box, which pushed every player 3px
     right of the coordinate they declared and let the name label overlap them. */
  /* Control scale. The lineup screen had 11 distinct control specs on one view
     (heights 32/36/44/56, radii 0/6/8/12/16, six font sizes). Two sizes cover
     everything except the bottom nav, which is a different component.
       sm  36px / r8 / 11.5px  dense inline chips inside a rail or bar
       md  44px / r8 / 13px    every button and every standalone chip           */
  .fmlineup [style*="cursor:pointer"], .fmpitchpane [style*="cursor:pointer"],
  .fmrail [style*="cursor:pointer"], .fmside [style*="cursor:pointer"] {
    border-radius:8px !important;
  }
  .fmlineup [style*="min-height:32px"], .fmpitchpane [style*="min-height:32px"],
  .fmrail [style*="min-height:32px"], .fmside [style*="min-height:32px"],
  .fmlineup [style*="min-height:44px"], .fmpitchpane [style*="min-height:44px"],
  .fmrail [style*="min-height:44px"], .fmside [style*="min-height:44px"] {
    min-height:44px !important; font-size:13px !important;
  }
  .fmlineup [style*="min-height:44px"], .fmpitchpane [style*="min-height:44px"],
  .fmrail [style*="min-height:44px"], .fmside [style*="min-height:44px"] {
    font-size:13px !important;
  }
  .fmpitch { container-type:inline-size; --tok:max(26px, 9cqw); }
  /* Three midfielders sit about 20% of the pitch apart. On a phone that is ~68px,
     and the name chip was running to 93px once the position and the out-of-position
     word were appended -- "Tường CM" and "Trung LB đá được" overlapped by a
     measured 14px. A narrow pitch drops the two extras: the token's own position is
     obvious from where it stands, and the ring colour already carries the fit. */
  .fmname { max-width:30cqw; }
  .fmname > span { overflow:hidden; text-overflow:ellipsis; }
  @container (max-width: 380px) {
    /* `.fmfit` la mot CUM TU ("da duoc", "lech tuyen") -- no chinh la thu tung
       lam hai bien ten de len nhau 14px, va vong mau quanh o da noi cung mot
       dieu. Van giau tren san hep.
       `.fmpos` thi KHONG giau nua: tu khi huy hieu duoi so ao doi thanh MA CUA O,
       day la cho duy nhat con noi ra vi tri so truong cua nguoi -- va no chi hien
       khi vi tri do KHAC ma o, tuc phan lon o van khong co gi them. */
    .fmpitch .fmfit { display:none !important; }
    /* Ba tien ve dung cach nhau ~52px tren san 345px, nen bien ten khong the
       mang ba muc. Bo DIEM: no quyet dinh it hon vi tri (o nay hop luat hay
       khong), va van doc duoc o hang du bi lan tab "Danh sach". Chu nho lai mot
       nac de con hai muc cung vua. */
    .fmpitch .fmrate { display:none !important; }
    .fmpitch .fmname { font-size:11px !important; }
    .fmpitch .fmpos { font-size:11px !important; }
  }
  /* Ma vi tri chuyen VAO token, khong con phu thuoc vao be ngang cua san.
     Truoc day no la mot chu noi them vao bien ten, ma bien ten thi no ra hai ben
     -- do la ly do "Tuong CM" va "Trung LB da duoc" tung de len nhau 14px, va
     la ly do dong tren phai giau no di tren san hep. Token thi rong co dinh 44px
     va da co san khoang ho o goc, nen dan ma len token khong dung gi den khoang
     cach giua hai nguoi canh nhau. Doc duoc ma khong de nhau. */
  .fmrole { z-index:2; }
  /* Bang du bi tung la mot dai cuon NGANG. Do ra: dai rong 328px, moi hang rong
     ~317px -- tuc la nhin thay dung MOT nguoi trong bon, ba nguoi kia nam ngoai mep
     phai, khong co dau hieu nao cho biet ho ton tai. Cuon ngang tren dien thoai la
     thu nguoi ta khong nghi den khi trang von da cuon doc roi.
     Doi thanh cot doc: bon nguoi hien ca bon, cuon doc neu dong hon nam nguoi. */
  /* width:100% mot minh KHONG du: o trong flex mac dinh min-width:auto, tuc khong
     duoc co nho hon noi dung cua no. Cong lai hang can 361px trong khung 343px, va
     dai du bi moc them mot thanh cuon NGANG 18px -- dung cai thu ma doi sang cot doc
     la de tranh. Cho hang co lai va cho cot ten cat bot bang dau ba cham: ten la o
     duy nhat cat duoc ma van doc duoc, giong hang trong danh sach cho. */
  .fmbench > .fmrow { width:100%; flex-shrink:0; min-width:0; }
  /* Hai nut chu "Bo ra" + "Vao san" an ~40% moi hang, ep cot ten con 85px nen
     "Hoang Tien Dung" bi cat. Ca hai deu da co san trong menu nhan-giu cua chinh
     hang do (benchCtx: "Vao san" / "Bo khoi du bi"), nen giu lai nut hay dung
     nhat va bo nut hiem. Ten duoc tra lai cho, khong con bi cat. */
  .fmbench > .fmrow > .bench-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Hang trong danh sach cho: do ra 6 o cong lai 357px cong 50px khe, nhet vao
     be ngang long 304px -- nen nut "+ Vao du bi" rot xuong dong hai va hang cao
     84px thay vi 56px. Ca doi 14 nguoi thi thanh 1176px thay vi 784px.
     Ep mot dong va cho ten co lai (con so, vi tri, diem va nut deu la be rong co
     dinh; ten la thu duy nhat co the cat bot ma van doc duoc). */
  .fmpool > .fmrow { flex-wrap:nowrap !important; gap:8px !important; }
  .fmpool > .fmrow > .pool-name {
    min-width:0 !important; flex:1 1 auto !important;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* O vi tri rong 46px de chua ma dai nhat la "CDM" -- do ra 26px. Tra 12px thua
     lai cho cot ten, vi ten la thu duy nhat trong hang bi cat. */
  .fmpool > .fmrow > .pool-pos { width:62px !important; }
  /* Hai cot ban thang / kien tao chi song o man rong (bat lai trong khoi
     min-width:1280px). Man hep vua du cho ten, them cot la cat ten. */
  /* !important vi hang du lieu dat display thang trong style noi tuyen -- khong
     co !important thi o the van chiem cho voi be rong 0 va lech ca hang. */
  .pool-perf, .pool-card, .pool-ready { display:none !important; }
  .pool-pos { display:none !important; }
  /* Cot nao song thi hoi CHINH CAI BANG, khong hoi man hinh.

     Truoc do cac cot bat theo `@media (min-width:1280px)`. Nhung bang nay nam
     trong mot cot co be rong rieng: o man 1440 cot chi rong 450px ma ca hang can
     680px -- cat mat 230px, va phan bi cat dung la ĐANG Ở, ĐIỂM va nut hanh dong.
     Doi nguong len 1600 khong cuu duoc: o 1920 do lai van tran 325px va cot ten
     con 0px. Be rong man hinh khong noi gi ve be rong cua cai bang.

     Nguong duoi day do tu chinh cac cot: bat buoc (cham, so, ten 88, diem danh,
     san sang, diem, nut) + khe + padding = 450px. Them ĐANG Ở la 520, them THE
     la 575, them bon cot thong ke mua la 765. */
  .fmpool { container-type:inline-size; }
  /* Duoi 460px thi ngay ca bo bat buoc cung khong vua: bo nut hanh dong va cot
     diem, giu lai ten + diem danh + san sang. Hang van mo duoc menu bang chuot
     phai / cham giu, va van keo tha duoc, nen khong mat duong nao -- chi mat mot
     loi tat. Can bac nay vi o man 1920 rãnh phai HEP HON o 1440 (339px so voi
     450px): bo cuc >=1600 chia lai luoi, man to ra ma cho cho bang lai it di. */
  @container (max-width:459px) { .pool-act, .pool-rate { display:none !important; } }
  @container (min-width:520px) { .pool-pos { display:block !important; } }
  @container (min-width:575px) { .pool-card { display:flex !important; width:44px !important; } }
  @container (min-width:765px) { .pool-perf { display:block !important; } }
  .pool-ready { display:block !important; }
  /* Man rong: dung dung be ngang. Truoc day toan bo man "Doi hinh" tren PC la
     bo cuc dien thoai keo gian -- do duoc o 1920: khung 1888px, san chi 305px nam
     giua, ~790px trong MOI BEN, con bang du bi va nut bam thi tri dai 1888px cho
     bon dong chu. Nay chia hai cot: san ben trai (to gap ruoi vi cao 620 thay vi
     430), bang du bi + nut bam + nut luu don sang cot phai. Dai so lieu tren cung
     van vat ngang ca hai cot vi no noi ve ca man. */
  /* Tong quan tren man >=1600px: cot trai rong 1493px ma xep chong ba the len
     nhau cao 1230px trong khung 941px -- 95 nut ro xuong duoi nep man. Chia doi:
     BUOI TOI + QUY DOI ben trai, Lich thang ben phai cao het hai hang. Cao nhat
     con 688px, vua trong mot man. */
  /* O so do doi hinh de trong khi tran chua ghi so do -- 150px chet moi hang.
     Va o ghi chu bi chan 760px nen hang 1888px con 426px trang o duoi phai. */
  /* The cau thu: moi nhom vi tri co luoi rieng, nen nhom "Thu mon" 1 nguoi de
     trong 1575/1878px hang. Xep hai nhom canh nhau: moi nhom rong ~930px, luoi
     con 3 the mot hang -> nhom 1 nguoi chi phi 2 o thay vi 5, va ca man thap di
     mot nua nen thoi rot xuong duoi nep. */
  .pcgroups { display:grid !important; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px 16px; align-items:start; }
  /* Cai dat doi xep tam khoi thanh MOT cot rong 1862px: cao 2250px trong khung
     1016px, tuc phai cuon hon gap doi man de xem het cai man it phai cuon nhat
     trong app. Hai cot, the thap hon keo cho het hang. */
  .mxgrid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 1px; background:rgba(255,255,255,0.06); }
  .setgrid { display:grid !important; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:stretch; }
  .mx-shape:empty { display:none !important; }
  @media (min-width:1600px) {
    .fmover > *:nth-child(1) {
      display:grid !important;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      grid-auto-rows:min-content;
      gap:16px;
      align-content:start;
    }
    .fmover > *:nth-child(1) > *:nth-child(3) { grid-column:2; grid-row:1 / span 3; }
    .fmover > *:nth-child(1) > *:nth-child(4) { grid-column:1; grid-row:3; }
    /* Hai the tren cao het co, the thu ba an phan con lai -- truoc do khoi trai
       ket thuc o y=911 trong khung den y=1064: 153px nen tron trong khi cot phai
       phai cuon giau 316px. Lich thang trai het chieu cao, o ngay gian theo. */
    .fmover > *:nth-child(1) { grid-template-rows:auto auto 1fr; }
    .fmover > *:nth-child(1) > *:nth-child(3) { display:flex; flex-direction:column; }
    .fmover > *:nth-child(1) > *:nth-child(3) > .onlywide:nth-of-type(1) { flex:1 1 auto; grid-auto-rows:minmax(46px, 1fr); }
    .ovrecent { display:flex; flex-direction:column; }
    .ovrecent > div:nth-child(2) { flex:1 1 auto; justify-content:space-evenly; }
    /* Bon cot thong ke mua + cot the CHI bat o day, khong phai o 1280.

       Chung tung bat theo be rong MAN HINH, nhung bang nay nam trong mot cot chi
       rong 450px o man 1440 -- ma ca hang can 680px. Do duoc: 230px bi cat, va
       phan bi cat dung la ĐANG Ở, ĐIỂM va nut Vào sân / Về dự bị, tuc ba thu
       can de quyet dinh va thao tac. Man cang rong thi cot cang rong, nen doi
       nguong len 1600 thay vi doan mot con so khac. */
  }
  @media (min-width:1280px) {
    .fmpitchpane {
      display:grid !important;
      /* 360 -> 310: cot 2 chi can du rong cho mot hang du bi (so + ten + vi tri +
         diem + nut "Vao san"), va no dang thua 347px CHIEU CAO chu khong thieu be
         ngang. 50px do tra cho bang ca doi, noi cot ten dang bi cat 5/14. */
      grid-template-columns:minmax(0,1fr) 310px;
      grid-template-rows:auto auto 1fr;
      align-items:start; column-gap:20px; row-gap:10px;
      /* Chieu cao san o day KHONG duoc dung `100%`: o luoi nay hang cua san cao
         auto, nen `100%` la mot chieu cao khong xac dinh va san co lai bang 0 --

       ("hep 14%") nen bien ten dam vao nhau -- do duoc Tung/Long chong 4px va
       Long/Dung chong 6px, trong khi san mot minh chong 0px. Bo diem ra khoi bien

       "Xep hang noi bo" xuong y=1154 -- tuc CA the xep hang nam duoi nep man 1080,
       va no la thu gan nhat voi "vinh danh mot con nguoi" tren man dau tien. Hang
       68px = dem 12+12 cong nhom nut cao 44px; 44 la nguong cham ngon tay, khong
       phai nguong con tro. O man rong ha xuong 34px. */
    .fmattrow { padding-top:7px !important; padding-bottom:7px !important; }

    .fmattrow .fmact, .fmattrow .fmact * { min-height:34px !important; height:34px !important; }
    .fmpitchpane[data-dual="1"] .fmrate { display:none !important; }

       xuong the "TINH TRANG DOI HINH" o cot trai. Hai cho cung in mot bo so la
       nhan doi, khong phai nhac lai cho chac. */
    .fmpitchpane .fmstats { display:none !important; }
    /* San mot minh rong 604px thi khong con ly do de chu tren no be nhu hoi 396px:
       "lech tuyen" do duoc 10px va ma vi tri 9-11px -- muc chu nho nhat man hinh,
       dung cho canh bao quan trong nhat tren san. */
    /* Cot 2 xuong 310px thi ten du bi dai nhat thieu 7-8px ("Hoang Tien Dung"
       108/100, "Dang Quoc Viet" 101/94). Lay lai tu dem hang (9->6) va khe (7->5,
       sau khe = 12px) -- khong dung vao cot ten cua bang ben phai. */
    .fmbench > .fmrow { padding-left:6px !important; padding-right:6px !important; gap:5px !important; }
    /* Huy hieu ma o (.fmrole) con 9px trong khi ma vi tri so truong da len 12 --

    /* Vong 12 toi chi ap cho san don; trong tai vong 13 dem lai 7 nhan 9px o tab

    .fmpitchpane .fmrole { font-size:11px !important; height:17px !important; }

       MOT MINH, 5/6 hang trong, cao 408px vi cac truong xep doc. Trang cuon 335px

    /* Bang Thanh vien 14 nguoi: hang 62px x14 + 3 tieu de nhom -> 4/14 hang duoi
       nep 1080 du chi co 14 nguoi (hang cuoi y=1426). O day bang TRAN cot, khac

       + noi dung 36; tren man chuot dem 6 la du. Dong phu (ngay sinh) giu nguyen. */
    .fmrow.mrow { padding-top:6px !important; padding-bottom:6px !important; min-height:44px !important; }
    /* Tieu de cot lap lai o MOI nhom hang (3 lan cho 14 nguoi, 40px moi lan).

    div:has(> .mhead) ~ div:has(> .mhead) > .mhead { display:none !important; }
    /* Lich thang o Tong quan: 42 o x min-height 62 -> the cao 768px, chi 385px tren
       nep, tuan cuoi (ngay 30) o y=1093. 5 buoi da trong mot thang; o 46px van du
       cho so ngay + mot chip su kien. */
    .fmday { min-height:46px !important; padding:3px 5px !important; }
    .tlwrap { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; align-items:start; }
    .tlwrap .tlyear { grid-column:1 / -1; }
    .mnote { flex-wrap:nowrap !important; margin-bottom:10px !important; }
    .mnote-text { flex:0 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* Dai "cham toi dau roi" + hai nut la mot the o cua luoi 6 cot -> bi keo len
       422px. Trai het mot hang rieng, cao theo noi dung (~60px). */
    /* auto-fit minmax(240px,1fr) sinh ra 6 cot tren man 1877px, nhung hang chi co
     3 the -- 923px moi hang bo trong ben phai. Chot 3 cot: 6 the xep dep hai hang,
     hai o toan-hang van span 1/-1 nhu cu. */
  /* Thu tu doc cua ho so: cho da tren san + hinh sao nang luc truoc, thanh cham
     chi so sau. Truoc do ba the thanh chi so chiem ca hang dau, day "CHO HOP TRONG
     SO DO" va radar xuong y=1073 -- duoi nep man 1016px, phai cuon moi thay thu
     bong da nhat cua ca trang. Doi bang `order`, khong doi DOM nen khoi hep van
     xep nguyen thu tu cu. */
  .pfgrid > *:nth-child(5) { order:1; }
  .pfgrid > *:nth-child(6) { order:2; }
  .pfgrid > *:nth-child(7) { order:3; }
  .pfgrid > *:nth-child(1) { order:4; }
  .pfgrid > *:nth-child(2) { order:5; }
  .pfgrid > *:nth-child(3) { order:6; }
  .pfgrid > *:nth-child(4) { order:7; }
  .pfgrid > *:nth-child(8) { order:8; }
  .pfgrid > .pfnote { grid-column:1 / -1; }
    .pfgrid > div:last-child { grid-column:1 / -1; }
    .pfgrid > div:last-child > div:nth-child(2) { flex-direction:row !important; flex-wrap:wrap; gap:14px 36px !important; align-items:flex-start; }
    .fmpitchpane[data-dual="0"] .fmfit { font-size:11px !important; }
    .fmpitchpane[data-dual="0"] .fmpos { font-size:11px !important; }
    .fmpitchpane[data-dual="0"] {
      /* San la mot SO DO doi hinh, khong phai ban do do dac. Ti le that cua san 7
         (0,58) ve ra mot hinh cao nghen tren man 16:9, nen chieu cao cham tran
         truoc khi be ngang dung het cho. FM ve san cua no o 613x909 = 0,674 --
         cung khong phai ti le san that. Lay 0,67 cho khop, san rong them ~45px
         ma vi tri cac o van la phan tram nen khong xe dich tuong doi. */
      --pitch-ar:0.67;
      --pitch-h:min(820px, calc(100dvh - 260px));
      --pitch-w:calc(var(--pitch-h) * var(--pitch-ar)) !important;
    }
    .fmpitchpane > .fmscroll:first-child, .fmpitchpane > .fmwarn { grid-column:1 / -1; }
    /* San khoa ti le nen no khong bao gio lap kin cot 1; can giua thi doc ra

    .fmpitchrow { grid-column:1; grid-row:2; justify-content:center !important; }
    .fmpitchrow > div { margin-inline:auto; }
    .lp-hint   { grid-column:1; grid-row:3; align-self:start; }
    /* Truoc: the du bi cao 260 nam dinh tren mot hang cao 697 -- 400px hong o
       GIUA cot, kieu lo thung chu khong phai le trang. The nay lai chinh la vung
       tha khi keo nguoi (`[data-bench]` trong hit-test), nen cho no cao het hang
       vua lap lo vua lam vung tha to gap ba. Tran 264px la con so cho dien thoai:
       doi nao dong du bi thi o day van cuon, khong bi cat. */
    /* Ba thu cua cot 2 tung nam o ba hang luoi khac nhau, ma hang 2 cao bang san
       (697px) nen bang du bi cao 260 de lai mot lo 400px o GIUA cot, roi hang nut
       bat dau tan y=903. Gop lam mot khoi doc: don len dinh, trong don xuong day
       -- le trang duoi day thi binh thuong, lo o giua thi khong. */
    /* Chi nam o hang 2 -- hang do cao bang san (697px) nen la mot chieu cao XAC
       DINH, con `grid-row:2/-1` thi cac hang duoi tu gian theo noi dung: bang chi
       dao 733px day hang nut xuong y=1291, tuc duoi mep man 211px. */
    .lp-col2   { grid-column:2; grid-row:2; align-self:stretch; height:100%; display:flex; flex-direction:column; gap:10px; min-height:0; }
    .lp-col2 > * { flex:0 1 auto; min-height:0; }
    .lp-bench  { display:flex; flex-direction:column; min-height:0; }
    .lp-bench .fmbench { max-height:none !important; flex:0 1 auto; min-height:0; }
    /* Vung tha chi can du to de tha trung, khong phai du to de lam nen nha:
       431px chi chua mot nhan chu la mot lo trong doi lot vung tha. */
    .lp-col2 .lp-drop { flex:0 0 auto; height:76px; min-height:0; }
    /* Bang chi dao ca nhan an not phan con lai cua cot, cuon trong than. */
    .lp-col2 .lp-instr { flex:1 1 auto; min-height:0; overflow-y:auto; }
    /* Khi bang chi dao ca nhan dang mo, no can 725px ma chi duoc 424 -- 41.5% noi
       dung nam duoi nep, trong do co TRON muc "CHI DAN RIENG". Bang du bi luc do
       khong phai thu dang lam, nen ep no lai lay cho. */
    .lp-col2:has(.lp-instr) .fmbench { max-height:120px !important; }
    /* Vung cuon long khong co dau hieu gi bao la con noi dung ben duoi -- trang
       khong cuon duoc (cao dung 1080) nen nguoi dung tuong het bai. Mo dan mep
       duoi + thanh cuon manh de noi ra. */
    .lp-col2 .lp-instr { scrollbar-width:thin; }
    .lp-col2 .lp-instr::after { content:""; position:sticky; bottom:-14px; display:block;
      height:22px; margin:-22px -14px -14px; pointer-events:none;
      background:linear-gradient(180deg, rgba(31,35,50,0) 0, rgba(31,35,50,0.96) 100%); }
    /* Bang "CA DOI" tren man rong: bo chu diem danh (cham mau ben trai da noi
       roi), thay bang so ban thang va kien tao -- chon nguoi da ma khong thay ai
       ghi may ban thi dang chon bang cam tinh. */
    /* Do duoc o cot 760px: hop ten rong 378px ma chuoi dai nhat ("Hoang Tien Dung")
       chi ton 108px muc -- 270px trong moi hang, 14 hang. Cung luc do trang thai diem
       danh bi nen xuong mot cham 7x7px, tuong phan 2,47:1 (duoi nguong 3:1 cua WCAG
       cho thanh phan phi van ban) va khong co chu giai mau nao trong ca panel. Tra chu
       ve: cho trong cua cot ten thua du de chua no. */
    /* 62px chu khong 78: tu khi o trong noi "chua tra loi" (mac dinh im lang),
       gia tri dai nhat con phai in la "Chua chac" ~60px. 16px do la phan cuoi
       cua 230px tung bi cat khoi bang. */
    .fmpool .pool-att, .pool-head .pool-att { display:block !important; width:62px !important; }
    /* 34px la be rong nho nhat chua het chu "K.TẠO" o co 9px -- 30px cat mat 3px.
       Nut hanh dong do duoc dung 73px; hang tieu de phai chua dung con so do,
       khong thi ca hang tieu de lech 12px so voi du lieu ben duoi. */
    /* 11px chu tieu de can 39px cho "K.TAO" va 31px cho "DIEM" -- do duoc cat 5px
   o ca hai khi con 34/26. No rong ra thi cot ten hep lai 12px, van du. */
.fmpool > .fmrow > .pool-perf, .pool-head > .pool-perf { width:40px !important; }
    .fmpool .pool-rate, .pool-head .pool-rate { width:32px !important; }
    .fmpool .pool-act { width:73px !important; justify-content:center; }
    /* DA THU ep buoc dong 56 -> 38px cho giong mat do bang cua FM. Do lai thi no
       tao ra loi khac: doi co 14 nguoi, bang co lai con 532px trong cot 922px, tuc
       334px trong moi. FM xep dong 29px vi no liet ke 17+ nguoi; o day 56px la con
       so LAP VUA cot. Giu 56px, va no cung dung bang nguong cham 44px cho may bang. */
    .pool-head { display:flex !important; }
    .fmpitch   { height:var(--pitch-h) !important; }
    /* Tran 420px cua danh sach "CA DOI" la con so cho dien thoai. O 1920 cot
       phai cao 922px ma the chi cao 455 -- 467px den thui, va nguoi dung chi
       thay 7 trong 14 nguoi roi phai cuon. Cho the cuoi cung an het cot. */
    .fmside > * { flex:1 1 auto; min-height:0; overflow-y:auto; margin-top:0 !important; }
    .fmside > *:last-child { display:flex; flex-direction:column; overflow:hidden; }
    .fmside .fmpool { max-height:none !important; flex:1 1 auto; min-height:0; }
  }
  /* Bang thanh vien: bon cot thanh tich chi song o man rong. Duoi 1100px thi
     cat chung di va tra grid ve dung mau 8 cot cu -- `grid-template-columns` den
     tu binding noi tuyen nen phai `!important` moi de len duoc. */
  @media (max-width:1099px) {
    .mperf { display:none !important; }
    .mhead, .fmrow.mrow { grid-template-columns:44px minmax(120px,1.6fr) 84px 88px 52px 108px 96px 44px !important; }
  }
  /* O trong thi khong co ma vi tri -- chinh cai token da la ma roi.
     Can `!important`: `.fmrole` mang `display:grid` NGAY TRONG the, ma style noi
     tuyen thang moi rule khong co !important -- nen rule nay chua bao gio chay,
     va o trong van deo mot vien thuoc 8x14 rong khong, khong chu. */
  .fmslot .fmtoken[data-empty="1"] + .fmrole,
  .fmslot .fmtoken[data-empty="1"] ~ .fmrole { display:none !important; }
  /* And the pitch has to end above the bottom nav. It was 521px tall under 354px of
     chrome in an 840px viewport, so the keeper fell off the screen and the captain
     had to scroll to see his own back line. */
  @media (max-width: 900px) {
    /* Capping the height while the width stays pinned to the column breaks the
       shape instead of shrinking it -- measured 343x382 (0.898) on a pitch that
       declares 3/4. The height cap is right; the width has to follow it. */
    /* 395px la phan chrome TREN san. Con thanh "Luu doi hinh" bam duoi
       (`sticky; bottom:92px`, cao 54px) an them ~146px o day man hinh, va tru
       395 khong cho no cho nao. Do tren may 375x667, cuon len dau: day san o
       617, dinh thanh o 521 -- 96px cuoi san, ke ca ca o thu mon, nam DUOI
       thanh ngay khi vua mo. 395 -> 415 = 261px chrome tren + 92px offset cua
       thanh + 54px chieu cao thanh, do bang thuoc chu khong uoc luong (465 la
       lan uoc dau, no cat san mat 53px ma khong can thiet). +10px dem: dung
       415 thi tren may 667px khoang ho ra dung 0px -- cham vien, khong con
       cho cho lam tron.
       San toi thieu 300 -> 240: tren may 667px, chrome tren san da an 267px nen
       ngay ca 300px cung khong con vua (do lai: van thua 44px). 240 thi vua, va
       o cau thu van 30px. Cho thua that su la 267px chrome PHIA TREN -- do moi
       la cho dang cat, nhung go no la mot viec khac. */
    .fmpitch { height:auto !important; max-height:none !important;
      width:min(100%, var(--pitch-w), calc(max(240px, 100dvh - 425px) * var(--pitch-ar))) !important; }
  }
  /* A drag has no hover state to lean on, so the slots announce themselves for

     cursor fills. Driven by a class, not by a dragover handler -- that fires on
     every pixel and this runtime re-renders the whole tree per state change. */
  .dragghost { position:fixed; z-index:9999; pointer-events:none; opacity:.85; transform:translate(-50%,-50%) scale(1.1); filter:drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
  .fmslot > div:first-child > .fmtoken { transition:transform .12s ease, background .12s ease; }
  .fmslot { touch-action:none; width:max-content !important; max-width:none !important; height:auto !important; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .fmslot > div:first-child { position:relative; left:auto; top:auto; transform:none; flex:0 0 auto;
    width:var(--tok) !important; height:var(--tok) !important; }
  .fmlineup > .fmscroll { flex:0 0 auto; }
  .fmlineup > .fmscroll > div { flex-shrink:0; min-height:40px !important; padding:0 10px !important; font-size:13px !important; justify-content:center; overflow:hidden !important; }
  .fmpitchpane > .fmscroll { flex-shrink:0; }
  .fmslot .fmname { position:relative; left:auto; top:auto; transform:none; margin-top:0 !important; width:max-content; max-width:27cqw; line-height:1.2; padding:1px 5px !important; overflow:hidden !important; }
  .fmslot .fmname > span:last-child { font-size:0.82em; }

  .fmslot .fmname, .fmslot .fmname * { white-space:nowrap !important; }
  .fmslot .fmname > span:first-child { overflow:hidden !important; text-overflow:ellipsis !important; min-width:0; flex:1 1 auto; }
  .fmslot .fmname > span:last-child { flex:0 0 auto; overflow:visible !important; }
  /* Bien ten cua o tung nhoi BON thu vao mot hang rong toi da 27cqw (=107px o san

     bi cat, ke ca ten nguoi ("Dung" 21/28px) va chinh cum canh bao ("lech tuyen"

  .fmslot .fmfitline { max-width:27cqw; overflow:hidden; text-overflow:ellipsis;

  .fmslot .fmname > .fmpos, .fmslot .fmname > .fmrate { flex:0 0 auto; }
  .fmslot { max-width:30cqw !important; }
  .fmpitch[data-dense="true"] .fmname { display:none !important; }
  @container (max-width: 264px) { .fmslot .fmname > span:last-child { display:none !important; } }
  @container (max-width: 200px) { .fmslot .fmname { display:none !important; } }
  .fmpitch[data-dense="true"] .fmslot { max-width:none !important; }
  .fmside { container-type:inline-size; }
  @container (max-width: 340px) {
    .fmrowact > span:first-child { display:none; }
    .fmrowact > sc-if span, .fmrowact span[title] { width:44px !important; height:44px !important; }
  }
  .fmslot .fmtoken { width:var(--tok) !important; height:var(--tok) !important; font-size:max(10px, 3cqw) !important; }
  /* The token shrank, so the tap area is the whole slot (token + name), never the
     circle alone. Keep it above the 44px minimum. */
  .fmslot { min-width:44px; min-height:44px; justify-content:center; }
  /* Cap the drawing so a tall pane cannot stretch the pitch to 828x1136, which is
     what dropped the token from 14% of the pitch to 6%. */
  .fmpitch { max-width:100% !important; }
  /* Fund screen: auto-fit gave 3 columns on a wide viewport and orphaned the 4th
     card into row 2 col 1, leaving an L-shaped void. Column packing has no rows
     to align, so short cards stack instead of leaving holes. */
  @media (min-width:900px) {
    .fmfund { display:block !important; columns:2; column-gap:16px; }
    .fmfund > * { break-inside:avoid; margin-bottom:16px; }
  }
  /* Quy tren man rong: `columns:2` can theo thu tu DOM nen cot trai duoc
     130+295=425px con cot phai 792px -- 367px trong duoi cot trai. Xep tay:
     "Ai con no" + "So quy" mot cot, "Thu/chi" + "Chuyen tien" cot kia. */
  /* Chia khung san thanh hai cot (san + bang chi dao 310px) chi dung khi khung
     do that su rong. Do tren app that o 1280x800: cot giua chi duoc 294px vi cot
     bang ca doi chiem co dinh 710px, nen luoi ra `0px 310px` va SAN CO LAI BANG
     0 -- man quan trong nhat cua app bien mat. O 1440x900 san con 124px, ba o
     tien ve chong khit len nhau. Tu 1280 den 1599 tra ve mot cot; phan tinh kich
     thuoc san o khoi 1280 van giu nguyen, vi `--pitch-ar` khai trong do -- go ca

  @media (min-width:1280px) and (max-width:1599px) {
    .fmpitchpane { grid-template-columns:minmax(0,1fr) !important; }
    /* San o khoi nay hep hon (405px thay vi 604px), ma bien ten van an 27cqw nen

       dung 80px (20% be ngang san), nen bien phai duoi 80: 19cqw = 77px. */
    .fmslot .fmname, .fmslot .fmfitline { max-width:19cqw !important; }
    .fmpitchpane > * { grid-column:1 !important; }
    /* ...va phai tra `.lp-col2` ve mot HANG rieng, khong chi mot cot rieng.

  /* Nhun + mo di khi bam. translateY(1px) truoc day gan nhu khong thay duoc tren
     dien thoai -- cham vao ma man hinh khong doi gi thi nguoi ta cham lai lan nua,
     va da co buoi bi diem danh hai lan vi vay. Phai KHAI transition ngay tren
     chinh bo chon nay: dong [onclick] ben duoi khong phu het, vi phan lon thu bam
     duoc trong app chi mang cursor:pointer trong style noi tuyen chu khong co
     thuoc tinh onclick sau khi dc-mini gan tay cam.
     CSS thuan, khong JS: dc-mini ve lai ca cay moi lan setState nen moi trang thai
     giu bang JS deu bi xoa; :active thi trinh duyet tu giu. */
  [style*="cursor:pointer"] {
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
    transition:transform 90ms cubic-bezier(.16,1,.3,1), opacity 90ms cubic-bezier(.16,1,.3,1), filter 120ms cubic-bezier(.16,1,.3,1);
  }
  /* Re chuot qua thi phai co gi do doi. Dem duoc tren man Doi hinh: 139 thu bam
     duoc, ma ca app chi co BON quy tac :hover -- ban PC thi con tro la cach chinh
     de biet cai gi bam duoc, va gan nhu khong cai nao tra loi.

     Dung `filter` chu khong dung `background`: gan het cac thu bam duoc trong app
     deu dat mau nen ngay trong style noi tuyen, nen mot quy tac nen o day se thua
     tru khi dong `!important` vao 174 cho. `brightness` khong dung toi bo cuc va
     khong de len mau rieng cua tung thanh phan.

     sang mai cho toi khi cham cho khac -- dung cai ve nham "dang chon". */
  @media (hover: hover) and (pointer: fine) {
    [style*="cursor:pointer"]:hover { filter:brightness(1.13); }
    [style*="cursor:pointer"]:active { filter:brightness(0.94); }

    color:rgba(250,250,255,0.52) !important;

  .fmslot:active .fmtoken[data-empty="1"] {
    border-color:#C1D439; color:#C1D439;
    background:rgba(193,212,57,0.1) !important;
  }
  .fmtoken[data-empty="1"]:active { transform:scale(1.06); }
  /* Bo tam bien ten thi chu roi thang xuong co san ke soc, do tuong phan doi theo
     tung soc. Do tren nen soc dam nhat: 0.5 cho 4.8:1 -- dat chuan cho chu 12px
     nhung sat lan ranh, va con vach voi ke san chay qua duoi. 0.62 + mot vien chu
     toi mong cho 6.3:1 ma van khong bien no thanh mot cai chip nhu o da co nguoi. */
  .fmname[data-empty="1"] {
    background:transparent !important;
    color:rgba(250,250,255,0.62);
    font-weight:500 !important;
    text-shadow:0 1px 2px rgba(9,15,29,0.9);
  }
  /* `[onclick]` da go khoi bo chon nay: dc-mini gan tay cam bang JS nen KHONG
     phan tu nao mang thuoc tinh onclick -- do dem duoc tren app that la 0. Giu no
     lai chi lam nguoi doc sau tuong co mot lop phan hoi thu hai dang chay. */
  [role="button"], button, a, input, select { transition:background-color 150ms cubic-bezier(.16,1,.3,1), color 150ms cubic-bezier(.16,1,.3,1), box-shadow 150ms cubic-bezier(.16,1,.3,1), transform 150ms cubic-bezier(.16,1,.3,1); }
  /* Khong dat border-radius o day: outline tu bam theo bo cong san co cua
     phan tu. Dat cung 8px la o cau thu hinh tron bi vuong lai khi focus. */
  :focus-visible { outline:2px solid #C1D439; outline-offset:2px; }
  img { max-width:100%; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration:1ms !important; animation-duration:1ms !important; }
  }
  @keyframes fm-kenburns { 0% { transform:scale(1.06) translate3d(0,0,0) } 50% { transform:scale(1.14) translate3d(-1.5%,-1%,0) } 100% { transform:scale(1.06) translate3d(0,0,0) } }
  /* The keyframes set opacity outright, so an inline opacity on the element was
     being ignored -- a team's own photo stayed buried under the stock wash.
     The level comes from --sheen instead, which the element can set. */
  @keyframes fm-sheen { 0% { opacity:var(--sheen,.62) } 50% { opacity:calc(var(--sheen,.62) * 1.26) } 100% { opacity:var(--sheen,.62) } }
  @media (prefers-reduced-motion: reduce) {
    [data-anim] { animation:none !important }
  }
  .fmday .fmplus { opacity:0; transition:opacity 150ms }
  .fmday:hover .fmplus { opacity:.65 }
  @keyframes fm-flash { 0%,100% { box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06) } 50% { box-shadow:inset 0 0 0 2px #C1D439 } }
  @keyframes fm-pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }

  /* Man hep: MOT cot cho ca hai luoi cua man The cau thu.

     `.pcgroups` (xep hai NHOM tuyen canh nhau) duoc viet cho man >=1600px va
     mang `!important`, nen tren dien thoai no van chia doi 375px thanh hai cot
     160px -- luoi the ben trong du da dung mot cot van chi con 161px, va 80 cho
     bi cat chu. Dat o cuoi bang kieu de chac chan thang ca `!important` do. */
  @media (max-width:560px) {
    .pcgroups { grid-template-columns:minmax(0, 1fr) !important; }
    .pc-grid { grid-template-columns:minmax(0, 1fr) !important; }
  }
</style>
</head>
<body>

<div id="app"></div>

<!-- Design markup, verbatim from the canvas file "Da Phui FM.dc.html".
     Held in a text/html script so the browser does NOT parse it: <sc-for> lives
     inside <select> in a few places and the HTML parser would drop it there.
     dc-mini.js compiles this string; keep it in sync with renderVals() in app.js. -->
<script type="text/html" id="dc-template">

<div style="min-height:100vh; background:#090F1D; color:#FAFAFF; font-family:'Be Vietnam Pro', system-ui, sans-serif">

  <sc-if value="{{ isDoors }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative; min-height:100vh; display:grid; place-items:center; padding:24px; background:#090F1D">
      <div style="position:fixed; inset:0; pointer-events:none; background:linear-gradient(160deg, rgba(34,68,155,0.5) 0%, rgba(9,15,29,0.98) 55%)"></div>
      <div style="position:relative; width:100%; max-width:392px">
        <div style="text-align:center; margin-bottom:22px">
          <img src="logo.png" alt="Đá Phủi App" style="width:88px; height:88px; border-radius:18px; display:block; margin:0 auto 14px">
          <div style="font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:800; font-size:30px; letter-spacing:-0.03em">Đá Phủi App</div>
          <div style="font-size:13px; color:rgba(250,250,255,0.6); margin-top:6px">Quản lý đội bóng phủi — điểm danh, đội hình, quỹ</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px">
          <sc-if value="{{ notFirstRun }}" hint-placeholder-val="{{ true }}">
            <div onClick="{{ doorBackToTeam }}" style="cursor:pointer; display:flex; align-items:center; gap:14px; min-height:72px; padding:14px 18px; border-radius:12px; background:#1F2332; box-shadow:inset 0 0 0 1px rgba(193,212,57,0.45)">
              <fm-icon name="IconTeam" size="22"></fm-icon>
              <span style="min-width:0">
                <span style="display:block; font-weight:700; font-size:15px; color:#C1D439">Vào lại {{ teamName }}</span>
                <span style="display:block; font-size:13px; color:rgba(250,250,255,0.6); margin-top:2px">Đội đang lưu trên máy này — vẫn phải đăng nhập bằng số của bạn</span>
              </span>
            </div>
          </sc-if>
          <div onClick="{{ doorNew }}" style="cursor:pointer; display:flex; align-items:center; gap:14px; min-height:72px; padding:14px 18px; border-radius:12px; background:linear-gradient(90deg, #6821DC, #D16BF4)">
            <fm-icon name="IconSquad" size="22"></fm-icon>
            <span style="min-width:0">
              <span style="display:block; font-weight:700; font-size:15px">Tạo đội mới</span>
              <span style="display:block; font-size:13px; color:rgba(255,255,255,0.78); margin-top:2px">Tôi là đội trưởng, muốn lập đội</span>
            </span>
          </div>
          <div onClick="{{ doorJoin }}" style="cursor:pointer; display:flex; align-items:center; gap:14px; min-height:72px; padding:14px 18px; border-radius:12px; background:#1F2332; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.12)">
            <fm-icon name="IconContract" size="22"></fm-icon>
            <span style="min-width:0">
              <span style="display:block; font-weight:700; font-size:15px">Vào đội bằng mã</span>
              <span style="display:block; font-size:13px; color:rgba(250,250,255,0.6); margin-top:2px">Đội trưởng đã gửi tôi mã đội</span>
            </span>
          </div>
          <div onClick="{{ doorDemo }}" style="cursor:pointer; display:flex; align-items:center; gap:14px; min-height:60px; padding:12px 18px; border-radius:12px; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1); opacity:{{ demoOpacity }}">
            <fm-icon name="IconReload" size="20"></fm-icon>
            <span style="min-width:0">
              <span style="display:block; font-size:15px; color:rgba(250,250,255,0.75)">Xem thử bằng đội mẫu</span>
              <sc-if value="{{ demoBlocked }}" hint-placeholder-val="{{ false }}">
                <span style="display:block; font-size:13px; color:rgba(250,250,255,0.6); margin-top:2px; line-height:1.45">Máy này đã có đội rồi. Xoá sạch ở Đội &gt; Cài đặt đội trước nếu muốn xem đội mẫu.</span>
              </sc-if>
            </span>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isLogin }}">
    <div style="position:relative; min-height:100vh; display:grid; place-items:center; padding:24px; background:#090F1D; overflow:hidden">
      <div style="position:fixed; inset:0; overflow:hidden; pointer-events:none">
        <div data-anim="kenburns" style="position:absolute; inset:0; background:url('{{ loginBg }}') center/cover no-repeat; will-change:transform; animation:fm-kenburns 26s ease-in-out infinite"></div>
        <div data-anim="sheen" style="position:absolute; inset:0; background:linear-gradient(160deg, rgba(34,68,155,0.85) 0%, rgba(9,15,29,0.92) 42%); --sheen:{{ loginSheen }}; opacity:{{ loginSheen }}; animation:fm-sheen 14s ease-in-out infinite"></div>
      </div>
      <div style="position:relative; width:100%; max-width:392px">
      <div style="width:100%; border-radius:12px; background:#161925; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06); overflow:hidden">
        <div style="display:flex; align-items:center; gap:14px; padding:18px 20px; background:linear-gradient(90deg, #22449B 0%, #1B1D32 70%)">
          <img src="logo.png" alt="Đá Phủi App" style="width:56px; height:56px; flex-shrink:0; border-radius:10px; display:block">
          <div style="min-width:0">
            <div style="font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:800; font-size:24px; letter-spacing:-0.03em; line-height:1.05; white-space:nowrap">ĐÁ PHỦI</div>
            <div style="font-size:13px; color:rgba(250,250,255,0.7); margin-top:4px">quản lý đội bóng phong trào</div>
          </div>
        </div>

        <div style="padding:16px 20px 20px">
          <sc-if value="{{ showDoorBack }}" hint-placeholder-val="{{ false }}">
            <div onClick="{{ doorBack }}" style="cursor:pointer; display:inline-flex; align-items:center; gap:6px; min-height:44px; margin:-10px 0 2px; font-size:13px; color:rgba(250,250,255,0.6)">← Chọn lại</div>
          </sc-if>
          <div style="display:flex; gap:6px; padding:4px; border-radius:10px; background:#1F2332; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08); flex-shrink:0">
            <sc-for list="{{ authModes }}" as="am" hint-placeholder-count="2">
              <!-- 44px: "Dang nhap" / "Tao tai khoan" la hai nut dau tien bat ky ai cham vao
                   app nay, va chung cao 34px -- duoi nguong cham. Man dau tien ma phai
                   cham hai lan la an tuong dau tien. -->
              <div onClick="{{ am.click }}" style="flex:1; min-width:0; text-align:center; cursor:pointer; height:44px; display:flex; align-items:center; justify-content:center; border-radius:7px; padding:0 10px; font-size:13px; font-weight:700; white-space:nowrap; flex-basis:0; background:{{ am.bg }}; color:{{ am.fg }}">{{ am.label }}</div>
            </sc-for>
          </div>
          <sc-if value="{{ hasDoorHint }}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:10px; padding:9px 12px; border-radius:8px; background:rgba(193,212,57,0.10); box-shadow:inset 0 0 0 1px rgba(193,212,57,0.26); font-size:13px; line-height:1.5; color:#C1D439">{{ doorHint }}</div>
          </sc-if>

          <div>
          <div style="font-size:13px; font-weight:700; letter-spacing:0.08em; color:rgba(250,250,255,0.6); margin:16px 0 6px">SỐ ĐIỆN THOẠI</div>
          <input type="tel" value="{{ phone }}" onChange="{{ setPhone }}" placeholder="090 000 0000" style="width:100%; box-sizing:border-box; height:44px; padding:0 13px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px">

          <sc-if value="{{ isForgot }}" hint-placeholder-val="{{ false }}">
            <div>
              <div style="font-size:13px; font-weight:700; letter-spacing:0.08em; color:rgba(250,250,255,0.6); margin:12px 0 6px">NGÀY SINH TRONG HỒ SƠ ĐỘI</div>
              <input value="{{ dobInput }}" onChange="{{ setDob }}" placeholder="VD: 25/11/1997" style="width:100%; box-sizing:border-box; height:44px; padding:0 13px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px">
            </div>
          </sc-if>

          <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
            <div>
              <div style="font-size:13px; font-weight:700; letter-spacing:0.08em; color:rgba(250,250,255,0.6); margin:12px 0 6px">TÊN CỦA BẠN</div>
              <input value="{{ nameInput }}" onChange="{{ setNameInput }}" placeholder="VD: Nguyễn Văn A" style="width:100%; box-sizing:border-box; height:44px; padding:0 13px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px">
            </div>
          </sc-if>

          <div style="font-size:13px; font-weight:700; letter-spacing:0.08em; color:rgba(250,250,255,0.6); margin:12px 0 6px">{{ passLabel }}</div>
          <input type="password" value="{{ pass }}" onChange="{{ setPass }}" onKeyDown="{{ onLoginKey }}" placeholder="••••••" style="width:100%; box-sizing:border-box; height:44px; padding:0 13px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px">

          <sc-if value="{{ needsConfirm }}" hint-placeholder-val="{{ false }}">
            <div>
              <div style="font-size:13px; font-weight:700; letter-spacing:0.08em; color:rgba(250,250,255,0.6); margin:12px 0 6px">NHẬP LẠI MẬT KHẨU</div>
              <input type="password" value="{{ pass2 }}" onChange="{{ setPass2 }}" onKeyDown="{{ onLoginKey }}" placeholder="••••••" style="width:100%; box-sizing:border-box; height:44px; padding:0 13px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px">
            </div>
          </sc-if>

          </div>
          <div style="min-height:16px; margin:10px 0 2px; font-size:13px; color:#EC2E1A">{{ authMsg }}</div>
          <div onClick="{{ authSubmit }}" style="cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; height:48px; border-radius:8px; background:linear-gradient(90deg, #6821DC, #D16BF4); font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:700; font-size:15px; letter-spacing:-0.01em">{{ authCta }}<fm-icon name="IconRight" size="16"></fm-icon></div>
          <div style="display:flex; align-items:center; justify-content:center; margin-top:12px">
            <div onClick="{{ toggleForgot }}" style="cursor:pointer; min-height:44px; display:flex; align-items:center; padding:0 12px; border-radius:8px; font-size:13px; font-weight:600; color:#D16BF4; white-space:nowrap" style-hover="background:rgba(209,107,244,0.12)">{{ forgotLabel }}</div>
          </div>
          <div style="font-size:13px; color:rgba(250,250,255,0.64); margin-top:8px; line-height:1.6; text-align:center">{{ authHint }}</div>
          <sc-if value="{{ isFirstRun }}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.1); text-align:center">
              <div style="font-size:13px; line-height:1.6; color:rgba(250,250,255,0.7)">Máy này chưa có đội nào. Tạo đội của bạn ở <b>Tạo tài khoản</b>, hoặc xem thử bằng đội mẫu.</div>
              <div onClick="{{ loadDemo }}" style="cursor:pointer; display:inline-flex; align-items:center; min-height:40px; margin-top:10px; padding:0 16px; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.16); font-size:13px; color:rgba(250,250,255,0.85)">Xem thử đội mẫu</div>
            </div>
          </sc-if>
          <sc-if value="{{ notFirstRun }}" hint-placeholder-val="{{ true }}">
            <div style="margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.1); text-align:center">
              <div onClick="{{ goDoors }}" style="cursor:pointer; display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.16); font-size:13px; color:rgba(250,250,255,0.85)">Vào đội khác hoặc xem đội mẫu</div>
            </div>
          </sc-if>


          </div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isNoTeam }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative; min-height:100vh; display:grid; place-items:center; padding:24px; background:#090F1D; overflow:hidden">
      <div style="position:absolute; inset:0"></div>
      <div style="position:absolute; inset:0; background:linear-gradient(160deg, rgba(34,68,155,0.85) 0%, rgba(9,15,29,0.94) 45%); opacity:0.8"></div>
      <div style="position:relative; width:100%; max-width:392px; border-radius:12px; background:#161925; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06); overflow:hidden">
        <div style="padding:18px 20px; background:linear-gradient(90deg, #22449B 0%, #1B1D32 70%)">
          <!-- KHONG duoc ghi "TAI KHOAN DA TAO": luc nay chua co gi duoc luu ca. Trong
               tai vong 29 doc man nay roi tai lai trang, mat sach, khong mot canh bao.
               Tai khoan chi that su ton tai sau khi vao duoc mot doi. -->
          <div style="font-size:13px; font-weight:700; letter-spacing:0.1em; color:#F79009">CÒN MỘT BƯỚC NỮA</div>
          <div style="font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:800; font-size:22px; letter-spacing:-0.03em; margin-top:4px">{{ pendingName }}</div>
          <div style="font-family:'JetBrains Mono', monospace; font-size:13px; color:rgba(255,255,255,0.7); margin-top:2px">{{ pendingPhone }}</div>
          <div style="font-size:13px; color:rgba(255,255,255,0.78); margin-top:8px; line-height:1.5">Chưa lưu gì cả. Chọn một đội ở dưới thì tài khoản mới thành hình — đóng trang lúc này là phải làm lại từ đầu.</div>
        </div>
        <div style="padding:18px 20px 20px">
          <div style="font-size:13px; color:rgba(250,250,255,0.75); line-height:1.6">Bạn chưa thuộc đội nào. Có mã đội thì nhập vào để làm cầu thủ; chưa có đội thì tạo đội mới và bạn thành admin.</div>

          <div style="font-size:13px; font-weight:700; letter-spacing:0.08em; color:rgba(250,250,255,0.6); margin:16px 0 6px">MÃ ĐỘI (do admin đưa)</div>
          <input value="{{ joinCode }}" onChange="{{ setJoinCode }}" placeholder="VD: FCXT26" style="width:100%; box-sizing:border-box; height:44px; padding:0 13px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px">
          <div onClick="{{ doJoin }}" style="cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; height:48px; margin-top:10px; border-radius:8px; background:linear-gradient(90deg, #6821DC, #D16BF4); font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:700; font-size:15px">Vào đội bằng mã<fm-icon name="IconRight" size="16"></fm-icon></div>

          <div style="display:flex; align-items:center; gap:10px; margin:18px 0">
            <span style="flex:1; height:1px; background:rgba(255,255,255,0.1)"></span>
            <span style="font-size:13px; color:rgba(250,250,255,0.64)">hoặc</span>
            <span style="flex:1; height:1px; background:rgba(255,255,255,0.1)"></span>
          </div>

          <div style="font-size:13px; font-weight:700; letter-spacing:0.08em; color:rgba(250,250,255,0.6); margin:0 0 6px">TÊN ĐỘI MỚI</div>
          <input value="{{ newTeam }}" onChange="{{ setNewTeam }}" placeholder="VD: FC Xóm Ta" style="width:100%; box-sizing:border-box; height:44px; padding:0 13px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px">
          <div onClick="{{ doCreateTeam }}" style="cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; height:48px; margin-top:10px; border-radius:8px; background:#C1D439; color:#090F1D; font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:800; font-size:15px">Tạo đội mới · làm admin</div>

          <div style="min-height:16px; margin-top:10px; font-size:13px; color:#EC2E1A">{{ authMsg }}</div>
          <div onClick="{{ backToLogin }}" style="cursor:pointer; text-align:center; min-height:44px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:#D16BF4">← Về đăng nhập</div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isApp }}">
    <div class="fmapp">
      <sc-if value="{{ noCrypto }}" hint-placeholder-val="{{ false }}">
        <div style="position:sticky; top:0; z-index:41; display:flex; align-items:center; gap:8px; padding:9px 16px; background:rgba(236,46,26,0.16); box-shadow:inset 0 -1px 0 rgba(236,46,26,0.35); font-size:13px; color:#EC2E1A">
          <span style="flex-shrink:0">⚠</span><span>Trang đang mở không qua https nên mật khẩu chưa được bảo vệ. Hãy mở bằng link web của đội.</span>
        </div>
      </sc-if>
      <sc-if value="{{ hasNetErr }}" hint-placeholder-val="{{ false }}">
        <div style="position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:8px; padding:9px 16px; background:rgba(247,144,9,0.16); box-shadow:inset 0 -1px 0 rgba(247,144,9,0.35); font-size:13px; color:#F79009">
          <span style="flex-shrink:0">⚠</span><span>{{ netErr }}</span>
        </div>
      </sc-if>
      <div>
        <div style="position:sticky; top:0; z-index:20; background:linear-gradient(90deg, #22449B 0%, #090F1D 13.29%); border-bottom:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; gap:12px; padding:8px 16px; min-height:64px">
          <div style="position:relative; width:42px; height:42px; flex-shrink:0; border-radius:12px; overflow:hidden; background:rgba(255,255,255,0.07); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.12)">
            <sc-if value="{{ hasLogo }}" hint-placeholder-val="{{ false }}">

                            <div onClick="{{ at.set }}" onKeyDown="{{ at.kdown }}" tabindex="{{ at.tab }}" role="{{ at.role }}" aria-valuemin="1" aria-valuemax="20" aria-valuenow="{{ at.value }}" aria-valuetext="{{ at.vtext }}" aria-label="{{ at.label }}" title="{{ at.title }}" style="position:relative; grid-column:2; grid-row:1; min-width:0; display:flex; align-items:center; height:40px; border-radius:8px; overflow:hidden; cursor:{{ at.cursor }}; background:rgba(255,255,255,0.05); background-image:repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 calc(5% - 1px), rgba(255,255,255,0.13) calc(5% - 1px) 5%); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.36)" style-hover="box-shadow:inset 0 0 0 1px rgba(177,129,255,0.75)">

                    <div><div style="font-size:13px; font-weight:700; letter-spacing:0.07em; color:rgba(250,250,255,0.7); margin-bottom:6px">QUỐC TỊCH</div><input value="{{ form.nat }}" onChange="{{ setFNat }}" placeholder="VD: Việt Nam" style="width:100%; box-sizing:border-box; height:44px; padding:0 13px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px">
                    <div><div style="font-size:13px; font-weight:700; letter-spacing:0.07em; color:rgba(250,250,255,0.7); margin-bottom:6px">CHẤN THƯƠNG</div><input value="{{ form.hurt }}" onChange="{{ setFHurt }}" placeholder="VD: rách cơ đùi phải" style="width:100%; box-sizing:border-box; height:44px; padding:0 13px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px"></div>

                        </sc-for>

                    </div>

            </sc-if>
            <!-- Dai tab phai nam TREN hai dai bang o duoi. Do duoc: no ngoi o

                 huong: no phai dung yen. Hai dai kia la boi canh cua danh sach,
                 nen chung nam duoi tab, dung cho cua chung. -->
            <div style="display:flex; align-items:center; gap:8px 12px; flex-wrap:wrap; margin-bottom:10px">
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
                <sc-for list="{{ memberViews }}" as="mv" hint-placeholder-count="2">
                  <div onClick="{{ mv.click }}" style="cursor:pointer; min-height:44px; display:flex; align-items:center; padding:0 16px; border-radius:8px; font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:700; font-size:13px; white-space:nowrap; background:{{ mv.bg }}; color:{{ mv.fg }}; box-shadow:inset 0 0 0 1px {{ mv.line }}">{{ mv.label }}</div>

              <sc-if value="{{ isNarrow }}" hint-placeholder-val="{{ false }}">

            <!-- Dai chu thich nay + hai bang hanh dong day tieu de bang xuong y=360

            <div class="mnote" style="display:flex; align-items:center; gap:6px 10px; flex-wrap:wrap; margin-bottom:14px; padding:0 2px; font-size:13px; line-height:1.6; color:rgba(250,250,255,0.55)">

                    <!-- min(264px, 100%): tren dien thoai mot cot 264px cung khong vua, va lien

                         Do la loi cu cua CSS grid, khong phai loi cua the. -->
                    <div class="pc-grid">
                      <sc-for list="{{ cg.list }}" as="pc" hint-placeholder-count="6">
                        <div class="pcard" onClick="{{ pc.open }}" onContextMenu="{{ pc.menu }}" onPointerDown="{{ pc.pressStart }}" onPointerUp="{{ pc.pressEnd }}" onPointerCancel="{{ pc.pressEnd }}" style="cursor:pointer; display:flex; flex-direction:column; gap:11px; padding:14px 15px 12px; border-radius:16px; background:{{ pc.tierBg }}; box-shadow:inset 0 0 0 1px {{ pc.tierEdge }}, 0 10px 26px rgba(0,0,0,0.35), inset 0 34px 60px -34px {{ pc.tierGlow }}">

                          <!-- Cot trai: diem lon, vi tri, so ao -- dung nhip cua mot the bong.
                               Diem nam o goc tren trai vi do la thu duy nhat nguoi ta doc truoc. -->

                            </sc-if>
                            <sc-if value="{{ pc.showRating }}" hint-placeholder-val="{{ true }}">
                              <span class="pc-grade" style="color:{{ pc.tierInk }}; border-color:{{ pc.tierEdge }}">{{ pc.gradeMark }}</span>

        <sc-if value="{{ isHall }}">

                      <!-- KHONG duoc cat dong nay. Do duoc: "Bui Nhat Nam · Ngo Hoang Long +1" can

                  <div style="font-size:13px; font-weight:700; letter-spacing:0.07em; color:rgba(250,250,255,0.7); margin-bottom:6px">MÀU ÁO</div>
                  <input value="{{ ev.kit }}" onChange="{{ setEvKit }}" placeholder="VD: Đen" style="width:100%; box-sizing:border-box; height:42px; padding:0 12px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px">
                </div>
              </div>
              <div style="font-size:13px; color:rgba(250,250,255,0.62); margin-top:5px">Để trống ô đối thủ nếu đá nội bộ. Màu áo hiện ở thẻ buổi tới: {{ kitHint }}</div>
              <div style="margin-top:10px">
                <div style="font-size:13px; font-weight:700; letter-spacing:0.07em; color:rgba(250,250,255,0.7); margin-bottom:6px">SÂN / ĐỊA ĐIỂM · dán được link Google Maps</div>
                <input value="{{ ev.place }}" onChange="{{ setEvPlace }}" placeholder="Sân K3, hoặc dán link maps.google.com/..." style="width:100%; box-sizing:border-box; height:42px; padding:0 12px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px">
                <div style="font-size:13px; color:{{ mapHintColor }}; margin-top:5px">{{ mapHint }}</div>
              </div>
              <div style="margin-top:10px">
                <div style="font-size:13px; font-weight:700; letter-spacing:0.07em; color:rgba(250,250,255,0.7); margin-bottom:6px">TIỀN SÂN MỖI NGƯỜI</div>
                <input inputmode="numeric" value="{{ ev.fee }}" onChange="{{ setEvFee }}" placeholder="{{ feeHint }}" style="width:100%; box-sizing:border-box; height:42px; padding:0 12px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:15px; margin-bottom:10px">
                <div style="font-size:13px; font-weight:700; letter-spacing:0.07em; color:rgba(250,250,255,0.7); margin-bottom:6px">GHI CHÚ</div>
                <textarea value="{{ ev.note }}" onChange="{{ setEvNote }}" placeholder="VD: mang áo trắng, đóng tiền trước cho thủ quỹ" rows="2" style="width:100%; box-sizing:border-box; padding:9px 12px; border-radius:8px; background:#1F2332; border:1px solid rgba(255,255,255,0.12); color:#FAFAFF; font-size:13px; font-family:'Be Vietnam Pro', system-ui, sans-serif; resize:vertical"></textarea>
              </div>
              <div style="display:flex; gap:8px; margin-top:14px">
                <div onClick="{{ closeMenu }}" style="flex:1; flex-basis:0; text-align:center; cursor:pointer; min-height:44px; display:flex; align-items:center; justify-content:center; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.14); font-size:13px; font-weight:600; color:rgba(250,250,255,0.75)">Hủy</div>
                <div onClick="{{ menuSubmit }}" style="flex:1.3; flex-basis:0; text-align:center; cursor:pointer; min-height:44px; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:8px; background:linear-gradient(90deg, #6821DC, #D16BF4); font-family:'Be Vietnam Pro', system-ui, sans-serif; font-weight:700; font-size:13px"><fm-icon name="IconDoubleTick" size="14"></fm-icon>{{ menuCta }}</div>
              </div>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ navBottom }}" hint-placeholder-val="{{ true }}">
      <div style="position:fixed; left:0; right:0; bottom:0; z-index:29; background:rgba(18,21,38,0.94); backdrop-filter:blur(14px); border-top:1px solid rgba(255,255,255,0.1)">
        <div style="display:flex; align-items:center; justify-content:space-around; gap:2px; max-width:720px; margin:0 auto; padding:6px 8px 8px">
          <sc-for list="{{ navs }}" as="n" hint-placeholder-count="6">
            <div onClick="{{ n.click }}" style="flex:1; min-width:0; min-height:48px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border-radius:16px; padding:6px 4px; background:{{ n.navBg }}">
              <span style="color:{{ n.fg }}; display:inline-flex"><fm-icon name="{{ n.icon }}" size="20"></fm-icon></span>
              <span style="font-size:13px; font-weight:700; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; color:{{ n.fg }}">{{ n.label }}</span>
            </div>
          </sc-for>
        </div>
      </div>
      </sc-if>
    </div>
  </sc-if>
</script>

<script src="fmkit/icon-data.js"></script>
<script src="fmkit/fm-icon.js"></script>
<script src="dc-mini.js"></script>
<script src="app.js"></script>
</body>
</html>
